<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      Proyecto de demostración de HyperFrames Studio (T-364).

      El contenedor copia este proyecto a un emptyDir la primera vez y sirve
      `hyperframes preview` sobre él. GSAP se carga del CDN (igual que la
      plantilla `blank` del CLI); el studio y la previsualización funcionan sin
      red, solo la animación del timeline necesita el CDN. Para un proyecto
      real, monta un PVC o sustituye este directorio.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #05070f;
        --ink: #f5f7ff;
        --accent: #7aa2ff;
        --font-display: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 30% 20%, #14203c 0%, var(--ground) 60%);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        font-family: var(--font-display);
      }
      #title {
        color: var(--ink);
        font-size: 96px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      #subtitle {
        color: var(--accent);
        font-size: 32px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="10" data-track-index="0">
        HyperFrames Studio
      </h1>
      <p id="subtitle" class="clip" data-start="0.2" data-duration="9.8" data-track-index="1">
        T-364 · panel dev · https://hyperframes.dev.itadaptativa.es
      </p>
    </div>
    <script>
      // La plantilla `blank` del CLI usa esta misma forma: un timeline GSAP
      // pausado registrado en window.__timelines para que el studio pueda
      // hacer seek sin reproducir en tiempo real.
      const hasGsap = typeof window.gsap !== "undefined";
      if (hasGsap) {
        const tl = window.gsap.timeline({ paused: true });
        tl.fromTo(
          "#title",
          { opacity: 0, y: 24, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" },
          0,
        );
        tl.fromTo(
          "#subtitle",
          { opacity: 0 },
          { opacity: 1, duration: 0.5, ease: "power2.out" },
          0.3,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      }
    </script>
  </body>
</html>
